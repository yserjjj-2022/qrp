# Пример локального конфига. Скопируйте в config.local.yaml (он в .gitignore)
# или задайте те же значения переменными окружения.
#
# Зачем: строка предметной области помогает модели отличать искажения ASR от
# обычных слов, но содержит названия брокеров и продуктов. В публичном
# config.yaml её нет.
#
# Приоритет: QA_DOMAIN_HINT > config.local.yaml > config.yaml.

domain_hint: "Предметная область интервью: термины, продукты и организации, о которых говорит респондент"
