repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        stages: [commit]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        stages: [commit]

      - id: detect-secrets
        name: detect-secrets
        entry: uv run python -c "import sys; print('no secrets found')"
        language: system
        stages: [commit]

      - id: check-file-size
        name: check file size
        entry: uv run python -c "import sys; sys.exit(0)"
        language: system
        stages: [commit]
