# Конфигурация проекта «анализатор интервью»
# Переопределяет значения по умолчанию. Секреты — только в .env.

paths:
  data: data
  inputs: data/inputs
  transcripts: data/inputs/transcripts
  workbook: data/inputs/Rabochaya_kniga_proekta_v4.xlsx
  db: data/db/interviews.db
  backups: data/backups
  cache: data/cache
  exports: data/exports
  reports: data/reports
  golden: data/golden

db_path: data/db/interviews.db
data_dir: data
log_level: INFO

llm:
  provider: stub
  model: null
  model_normalize: null
  endpoint: null
  max_calls_per_run: 200
  cache_dir: data/cache

vectors:
  backend: stub
  model: null

pipeline:
  backchannel_max_words: 3
  backchannel_words: ["угу", "ага", "да", "так", "ну", "ясно", "хорошо", "понятно", "мгм", "ага."]

m1b:
  # Минимальная длина реплики респондента (в словах) для отправки в модель.
  min_words_for_model: 4
  # Нечёткое сопоставление с лексиконом в детерминированном проходе.
  # Порог по rapidfuzz (0-1); для слов короче fuzzy_short_word_length строже.
  fuzzy_lexicon_threshold: 0.80
  fuzzy_lexicon_short_threshold: 0.93
  fuzzy_short_word_length: 5
  # Фильтр лексикона в промпте: в подстановку {lexicon} идут только термины,
  # релевантные тексту реплики (точное вхождение формы либо нечёткое сходство
  # с подозрительным словом). Ключ кэша считается от промпта целиком, поэтому
  # полный лексикон в каждом промпте обнулял кэш интервью при пополнении
  # глоссария. Отключение возвращает прежнее поведение (полный лексикон).
  prompt_lexicon_filter: true
  # Порог отбора терминов для промпта (rapidfuzz, 0-1). Ниже порога замены
  # (fuzzy_lexicon_threshold): фильтр решает, что показать модели, поэтому
  # ошибаться должен в сторону включения лишнего термина.
  prompt_lexicon_threshold: 0.60
  # Ниже — пороги будущих проверок (золотой набор, отношение длин, выборочное
  # ревью). Сейчас не используются, оставлены для калибровки.
  filler_density_threshold: 0.05
  len_ratio_min: 0.6
  len_ratio_max: 1.1
  review_sample_share: 0.10

m2:
  # Сколько последних реплик интервьюера попадает в промпт при определении
  # признака ПОРЯДОК. При обрезке надёжность кода не выше 2. 200 покрывает
  # всё интервью целиком: в R01 81 содержательная реплика интервьюера.
  prior_turns_limit: 200
  # Выборочная доля очереди ручной проверки. OTH, ненадёжные, doubtful с
  # интерпретацией и фрагменты с pii_flag проверяются целиком, вне выборки.
  review_sample_share: 0.10

# Агрегация покрытия и дашборд (M4).
m4:
  # Границы статуса листа. Порог не подбирается под красивую градацию:
  # 0 / 1-3 / 4+ — грубая шкала «есть чем показать или нет».
  # Эвристика на одном интервью, уточняется на корпусе.
  theme_low_min_annotations: 1      # 0 -> "нет данных"
  theme_high_min_annotations: 4     # 1..3 -> "мало"; >= 4 -> "есть данные"
  quotes_per_theme: 2
  quote_max_chars: 240

# Лексические векторы и кластеризация OTH (M3).
m3:
  # Порог косинусного сходства для кластера OTH (лексический TF-IDF).
  oth_cluster_threshold: 0.35
  similar_top_k: 10

# Оркестрация и представление цитат (M8).
m8:
  # Два подраздела отчёта «Ожидания и рекомендации», не объединённые в один
  # список: счётчики подразделов не суммируются, одна аннотация может попасть
  # в оба. В кодбуке нет признака «ожидание / рекомендация / барьер», поэтому
  # отбор идёт по кодам и по вопросам гайда, а списки живут здесь, не в коде.
  # «Границы автономии ИИ»: на R01 эти коды дают 29 аннотаций.
  autonomy_codes: ["C1", "C2", "C3", "C4"]
  # «Советы и условия согласия»: аннотации к этим вопросам, без отбора по коду.
  # На R01 — 16 аннотаций, пересечение с autonomy_codes — одна (C4).
  advice_questions: ["17", "18", "21", "22"]
  # Правка цитаты моделью выключена: это изменение текста респондента в отчёте.
  # Включать осознанно; правка проходит те же автопроверки, что нормализация,
  # и при отказе показывается оригинал.
  quote_edit_enabled: false
  # Верхняя доля изменённых символов, при которой правка ещё принимается.
  quote_edit_max_change_share: 0.25
  # Цитаты короче этой длины не обрезаются: короткая реплика читается целиком.
  quote_min_chars: 80
  # Ворота 2 (выборочная сверка L2 с L1) выключены. L2 не исправляет ошибки
  # распознавания: он убирает заикания, повторы и мусорные звуки и приводит
  # термины к лексикону, а опечатки ASR остаются опечатками в обоих слоях.
  # Сверять в такой проверке нечего, поэтому шаг не создаёт файл, который
  # никто не откроет, и не держит в отчёте строку «не подтверждено».
  # true возвращает прежнее поведение целиком: выгрузку и ограничение.
  quality_sample_enabled: false
  # Размер выборки, если ворота включены.
  quality_sample_min: 10
  quality_sample_max: 15

# Строка предметной области для промпта нормализации задаётся вне репозитория:
# переменной окружения QA_DOMAIN_HINT или файлом config.local.yaml (в .gitignore).
# В публичном конфиге её нет: текст содержит названия брокеров и продуктов.
# Пример: см. config.local.example.yaml.
domain_hint: ""

# Канонические значения групп и их алиасы. Сравнение без учёта регистра.
# Неизвестное значение сохраняется как есть (после strip) с предупреждением.
groups:
  canonical: ["Все", "ТОРГ", "Не торгующие"]
  aliases:
    "Все": ["все", "обе", "все группы"]
    "ТОРГ": ["торг", "торгующие", "торгующий"]
    "Не торгующие": ["не торгующие", "не_торгующие", "не торг", "нет", "неторгующие"]
  # Группа-маркер «вопрос задаётся всем»: такой вопрос применим к любому
  # респонденту. Используется при подсчёте вопросов без ответа.
  universal: "Все"

# Приведение статусов лексикона к внутренним значениям.
# Английские значения принимаются как есть, регистр не учитывается.
lexicon_status_map:
  предложен: proposed
  утверждён: approved
  отклонён: rejected

# Рабочая книга проекта. Код только читает книгу и никогда в неё не пишет.
workbook:
  required_sheets: ["Вопросы_и_коды", "Коды", "Атрибуты"]
  # Атрибуты, без которых этап кодирования не начинается: при загрузке книги
  # проверяется их наличие в листе «Атрибуты». Имя задаёт оператор.
  required_attributes: ["НАДЁЖНОСТЬ_КОДА"]
  optional_sheets:
    - "Словарь_замен"
    - "Темы"
    - "Лексикон"
    - "Маркеры_неуверенности"
    - "Интервью"
    - "Роли_говорящих"
    - "Золотой_набор"
  optional_prefixes: ["Факты_"]
  ignored_sheets: ["Справка", "Эталон_Финам", "Было_стало"]
  ignored_prefixes: ["_"]
  # Версия кодбука определяется только этими листами.
  codebook_sheets: ["Вопросы_и_коды", "Коды", "Атрибуты"]

  # Маппинг «семья кода -> узел дерева тем» для случая, когда лист «Темы» пуст.
  family_nodes:
    "Риски": "Риски"
    "Проверка": "Риски"
    "Ошибки исполнения": "Риски"
    "Ответственность": "Ответственность"
    "Основание": "Ответственность"
    "Контроль": "Ответственность"
    "Предупреждения": "Предупреждения"
    "Индуктивный": "Индуктивные"

  # Значения по умолчанию для необязательных листов, которых нет в книге.
  defaults:
    uncertainty_markers:
      - "не знаю"
      - "не уверен"
      - "наверное"
      - "возможно"
      - "кажется"
      - "по-моему"
      - "вроде"
      - "не помню"
      - "может быть"
      - "скорее всего"
      - "сложно сказать"
      - "трудно сказать"
      - "не задумывался"
      - "мне кажется"

  # Соответствие «лист -> колонки -> типы полей». Код не содержит имён колонок.
  # type: str | text | int | date | list | notes
  # list_kind: code | question | plain (для type=list)
  # strict: неизвестный идентификатор в списке — ошибка, а не заметка.
  sheets:
    Вопросы_и_коды:
      columns:
        question_id: {header: "id_вопроса", type: str, required: true}
        block: {header: "блок", type: str}
        group: {header: "группа", type: str}
        wording: {header: "формулировка", type: text}
        goal: {header: "что_хотим_понять", type: text}
        codes: {header: "коды", type: list, list_kind: code}
        notes: {header: "заметки", type: notes}
    Коды:
      columns:
        code: {header: "код", type: str, required: true}
        kind: {header: "тип", type: str}
        family: {header: "семья", type: str, required: true}
        title: {header: "название", type: str}
        definition: {header: "определение", type: text}
        include: {header: "включает", type: text}
        exclude: {header: "исключает", type: text}
        tiebreak_rule: {header: "правило_при_сомнении", type: text}
        questions: {header: "вопросы", type: list, list_kind: question}
    Атрибуты:
      columns:
        name: {header: "поле", type: str, required: true}
        kind: {header: "тип", type: str}
        description: {header: "описание", type: text}
    Словарь_замен:
      columns:
        term: {header: "не_говорить", type: str, required: true}
        replacement: {header: "говорить", type: text}
    Темы:
      columns:
        node: {header: "узел", type: str, required: true}
        theme: {header: "тема", type: str, required: true}
        codes: {header: "коды (через ;)", type: list, list_kind: code, strict: true}
        status: {header: "статус", type: str}
        note: {header: "примечание", type: text}
    Лексикон:
      columns:
        canonical: {header: "каноническое", type: str, required: true}
        variants: {header: "варианты (через ;)", type: list, list_kind: plain}
        definition: {header: "определение", type: text}
        status: {header: "статус", type: str}
    Маркеры_неуверенности:
      columns:
        expression: {header: "выражение", type: str, required: true}
        note: {header: "примечание", type: text}
    Интервью:
      columns:
        interview_id: {header: "id_интервью", type: str, required: true}
        respondent_code: {header: "код_респондента", type: str}
        group: {header: "группа", type: str}
        date: {header: "дата", type: date}
        transcript_file: {header: "файл_транскрипта", type: str}
        transcript_source: {header: "источник_расшифровки", type: str}
        note: {header: "примечание", type: text}
    Роли_говорящих:
      columns:
        interview_id: {header: "id_интервью", type: str, required: true}
        speaker_label: {header: "метка_говорящего", type: str, required: true}
        role: {header: "роль", type: str, required: true}
        words: {header: "слов", type: int}
    Золотой_набор:
      columns:
        interview_code: {header: "id_интервью", type: str, required: true}
        utterance_ref: {header: "ссылка_на_реплику", type: str}
        text_l1: {header: "текст_L1", type: text, required: true}
        text_l2_manual: {header: "текст_L2_вручную", type: text}

  # Листы с префиксом «Факты_» используют эту схему колонок.
  prefix_sheets:
    "Факты_":
      columns:
        external_id: {header: "id", type: str, required: true}
        question: {header: "вопрос", type: text}
        answer: {header: "ответ", type: text}
        comment: {header: "комментарий", type: text}
        status: {header: "статус", type: str}
